<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="data:,">
</head>
<body>
  <script src="/static/js/theme.js"></script>

  <div class="landing">
    <nav class="landing-nav">
      <a href="/" class="brand">
        <div class="sidebar-header logo" style="width:32px;height:32px;">AI</div>
        {{ app_name }}
      </a>
      <button class="theme-toggle" data-theme-toggle>
        <span data-theme-icon></span>
        <span data-theme-label></span>
      </button>
    </nav>

    <section class="auth-page">
      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-mode="login" role="tab">Log in</button>
          <button type="button" class="auth-tab" data-mode="register" role="tab">Create account</button>
        </div>

        <form id="auth-form" class="auth-form" novalidate>
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required
                   minlength="3" maxlength="64" pattern="[A-Za-z0-9_.\-]+" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required maxlength="128" />
          </label>
          <p class="auth-hint" data-register-only hidden>
            Username: 3+ letters, digits, <code>_ . -</code> &middot; Password: 8+ characters
          </p>
          {% if invite_required %}
          <label data-register-only hidden>
            <span>Invite code</span>
            <input type="text" name="invite_code" autocomplete="off" />
          </label>
          {% endif %}

          <div class="auth-error" id="auth-error" role="alert" hidden></div>

          <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
        </form>
      </div>
    </section>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
